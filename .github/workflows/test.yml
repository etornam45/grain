name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grain_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/grain_test?sslmode=disable
